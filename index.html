<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zenithy - Web Design & Identity V Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #ffe6f0;
            --paper: #ffffff;
            --text-dark: #8a516b;
            --text-light: #bd859b;
            --accent-pink: #eb7aa6;
            --accent-yellow: #fcf2b6;
            --mint: #a2dcd4;
            --peach: #ffc2b3;
            --sky: #b8e9ed;
            --line-color: rgba(235, 122, 166, 0.2);
        }
        body {
            background-color: var(--bg-main);
            background-image: repeating-linear-gradient(to right, #ffe6f0, #ffe6f0 40px, #ffdbee 40px, #ffdbee 80px);
            font-family: 'Mitr', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
        }
        .font-fredoka { font-family: 'Fredoka', sans-serif; }
        .paper-container {
            background-color: var(--paper);
            position: relative;
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, var(--line-color) 35px, var(--line-color) 36px);
            background-position: top 40px center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .jagged-top {
            position: absolute;
            top: -12px; left: 0; width: 100%; height: 13px;
            background: linear-gradient(-45deg, transparent 9px, var(--paper) 0), linear-gradient(45deg, transparent 9px, var(--paper) 0);
            background-size: 18px 18px;
            background-repeat: repeat-x;
        }
        .jagged-bottom {
            position: absolute;
            bottom: -12px; left: 0; width: 100%; height: 13px;
            background: linear-gradient(-45deg, var(--paper) 9px, transparent 0), linear-gradient(45deg, var(--paper) 9px, transparent 0);
            background-size: 18px 18px;
            background-repeat: repeat-x;
        }
        .polaroid {
            background: #fff;
            padding: 8px 8px 35px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 1px solid #f5e6e6;
            position: relative;
        }
        @media (min-width: 640px) { .polaroid { padding: 10px 10px 45px 10px; } }
        /* Realistic Tape Effects (Multiply blend makes it look like real translucent tape) */
        .tape {
            position: absolute;
            mix-blend-mode: multiply;
            opacity: 0.85;
            z-index: 20;
        }
        /* รอยฉีกแบบเทปกระดาษ */
        .tape-1 { clip-path: polygon(1% 2%, 99% 0%, 98% 98%, 0% 100%); }
        .tape-2 { clip-path: polygon(0% 0%, 100% 1%, 99% 100%, 2% 99%); }
