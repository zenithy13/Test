<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenithy - Welcome to my shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🍓 ปรับโทนสีใหม่ให้เข้ากับรูป Zenithy (ฟ้าละมุน-ครีมพีช) 🍓 */
            --primary-bg: #e0f2fe; /* พื้นหลังสีฟ้าพาสเทลอ่อน */
            --box-bg: rgba(255, 255, 255, 0.45);
            --white: #ffffff;
            --pink-accent: #38bdf8; /* สีฟ้าบลัชออน */
            --blue-accent: #ffcdb2; /* สีครีมพีชละมุน */
            --text-dark: #334155; /* สีน้ำตาลเข้ม/เทาเข้มอมน้ำเงิน */
            --text-light: #64748b; /* สีเทาอมฟ้า */
        }
        body {
            background-color: var(--primary-bg);
            color: var(--white);
            background-image: radial-gradient(circle at 90% 10%, rgba(255,255,255,0.4) 0%, transparent 50%);
            overflow-x: hidden;
        }
        .font-mitr { font-family: 'Mitr', sans-serif; }
        .font-eng { font-family: 'Nunito', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--primary-bg); }
        ::-webkit-scrollbar-thumb { background: var(--pink-accent); border-radius: 10px; }
        /* Patterns and Decorative Elements */
        .checker-bg {
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2)),
                linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.2) 75%, rgba(255,255,255,0.2));
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        .right-dash-border {
            position: absolute;
            right: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            border-right: 3px dashed rgba(56, 189, 248, 0.3);
            z-index: 0;
        }
        .glass-panel {
            background: var(--box-bg);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            backdrop-filter: blur(5px);
        }
        .white-window {
            background: var(--white);
            border: 3px solid var(--white);
            border-radius: 1.25rem;
            color: var(--text-dark);
            box-shadow: 0 8px 20px rgba(51, 65, 85, 0.08);
            position: relative;
        }
        .window-header {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 2px solid #e2e8f0;
            background-color: #f8fafc;
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }
        .pill-tag {
            border-radius: 9999px;
            padding: 0.25rem 1rem;
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: lowercase;
            letter-spacing: 0.05em;
            color: white;
            display: inline-block;
        }
        .bg-pink-tag { background-color: var(--pink-accent); }
        .bg-blue-tag { background-color: var(--blue-accent); color: #334155; }
        .bg-purple-tag { background-color: #7dd3fc; }
        .star-icon {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="%23FFF" xmlns="http://www.w3.org/2000/svg"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg>') no-repeat center;
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        /* Emojis Background Animations */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 0.8; transform: scale(1.2) rotate(5deg); }
        }
        .animate-twinkle { animation: twinkle 4s ease-in-out infinite; }
        .delay-100 { animation-delay: 1s; }
        .delay-300 { animation-delay: 2s; }
        .delay-700 { animation-delay: 3s; }
        /* Avatar styling to match image */
        .avatar-frame {
            background-color: #f0f9ff;
            border: 4px solid white;
            border-radius: 1rem;
            padding: 0.5rem;
            position: relative;
        }
        .link-item {
            display: inline-block;
            background: #f0f9ff;
            color: var(--text-light);
            padding: 0.4rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            margin-right: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
            border: 1px solid #e0f2fe;
        }
        .link-item:hover {
            background: var(--pink-accent);
            color: white;
            transform: scale(1.02);
        }
        .contact-btn {
            background-color: var(--pink-accent);
            color: white;
            border-radius: 9999px;
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            border: 2px solid white;
            text-decoration: none;
        }
        .contact-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
